		<script>
			function runTestOnAgent(agent, testName, system, kernel, prioritize = false)
			{
				webui.scheduleTestOnAgent(agent + " " + testName + " " + system + " " + kernel + " " + (prioritize ? "high" : "low"));
			}

			function filteredSystemToRunTestsJS(systems)
			{
				webui.filteredSystemToRunTests(systems);
			}

			function setSuccessTestStatusJS(testIndex, state)
			{
				webui.setSuccessTestStatus(testIndex+" "+state);
			}
		</script>
